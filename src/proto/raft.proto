syntax = "proto3";
package raft;

// Minimal Raft RPCs — mirrors Figure 2 of the Raft paper.
// We deliberately omit InstallSnapshot in v2; the log stays bounded
// enough for a placement project. Snapshots are a v3+ concern.

service Raft {
    rpc RequestVote   (RequestVoteRequest)   returns (RequestVoteResponse);
    rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RequestVoteRequest {
    int64  term            = 1;
    string candidate_id    = 2;
    int64  last_log_index  = 3;
    int64  last_log_term   = 4;
}

message RequestVoteResponse {
    int64 term         = 1;
    bool  vote_granted = 2;
}

message LogEntry {
    int64  index        = 1;
    int64  term         = 2;
    string entry_type   = 3;   // "command" | "noop"
    string command_json = 4;   // JSON payload; empty for noop
}

message AppendEntriesRequest {
    int64             term            = 1;
    string            leader_id       = 2;
    int64             prev_log_index  = 3;
    int64             prev_log_term   = 4;
    repeated LogEntry entries         = 5;   // empty = heartbeat
    int64             leader_commit   = 6;
}

message AppendEntriesResponse {
    int64 term           = 1;
    bool  success        = 2;
    // Follower's hint so leader can quickly rewind nextIndex on mismatch
    // (paper §5.3 optimization). Not strictly required for correctness
    // but avoids O(term-length) rejections.
    int64 conflict_index = 3;
    int64 conflict_term  = 4;
}
